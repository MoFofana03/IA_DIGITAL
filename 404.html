<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — IYA Digital</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon_32.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; background: radial-gradient(120% 90% at 50% 30%, #141A4A 0%, var(--encre) 60%); }
    .e-mark { width: 120px; margin: 0 auto 40px; }
    .e-code { font: 900 clamp(110px, 22vw, 220px)/.8 var(--display); letter-spacing: -.07em; }
    .e-txt { margin: 24px auto 40px; max-width: 420px; color: #C9CDE6; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <img class="e-mark" src="/assets/img/symbole.svg" alt="IYA Digital">
    <div class="e-code">404<span class="dot dot--red dot--end"></span></div>
    <p class="e-txt">Cette page s'est perdue en route. Revenons à l'essentiel&nbsp;: votre marque.</p>
    <a class="btn btn--red" href="/"><span class="btn__dot"></span>Retour à l'accueil</a>
  </main>
</body>
</html>
